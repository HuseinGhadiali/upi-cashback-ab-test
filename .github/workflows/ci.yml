name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: pytest -q
      - name: Regenerate logs and execute the readout
        run: |
          python src/generate_data.py
          cd notebooks && jupyter nbconvert --to notebook --execute experiment_readout.ipynb --output /tmp/out.ipynb
